[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadhunter"
version = "0.3.0"
description = "Artemis: a local job-hunting and freelance agent. Finds leads, finds the right recruiter, writes the email or proposal, sends it from your Gmail after you approve, and follows up."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "certifi",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Manideep-Ai-ai/artemis"
Issues = "https://github.com/Manideep-Ai-ai/artemis/issues"

[project.scripts]
leadhunter = "leadhunter.cli:main"

[tool.setuptools.packages.find]
include = ["leadhunter*"]

[tool.setuptools.package-data]
leadhunter = ["data/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
